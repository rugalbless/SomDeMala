name: Gerar executáveis

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Linux
        if: runner.os == 'Linux'
        run: bash build_linux.sh

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SomDeMala-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
